apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recipe-rescue-root
  namespace: argocd
spec:
  project: recipe-rescue
  source:
    repoURL: https://github.com/iulianradean98/final_project.git
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
