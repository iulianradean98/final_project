name: Promote Release

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  open-release-pr:
    name: Open main to release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release branch exists
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          if ! git rev-parse --verify --quiet "origin/release^{commit}" >/dev/null; then
            echo "The release branch does not exist yet."
            echo "Create it once from main, protect it, then rerun this workflow."
            exit 1
          fi

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list \
            --head main \
            --base release \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -n "${existing_pr}" ]; then
            echo "Release PR already exists: #${existing_pr}"
            exit 0
          fi

          gh pr create \
            --base release \
            --head main \
            --title "Promote main to release" \
            --body "Promotes the validated main branch into the protected release branch.

          After this PR is approved and merged, ArgoCD will reconcile the production applications from \`release\`."

      - name: Write promotion summary
        run: |
          {
            echo "### Release promotion"
            echo ""
            echo "- Source branch: \`main\`"
            echo "- Target branch: \`release\`"
            echo "- Approval gate: protected release PR"
          } >> "${GITHUB_STEP_SUMMARY}"
