name: Promote Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  open-release-pr:
    name: Open release approval PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release branch exists
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          if ! git rev-parse --verify --quiet "origin/release^{commit}" >/dev/null; then
            echo "The release branch does not exist yet."
            echo "Create it once from main, protect it, then rerun this workflow."
            exit 1
          fi

      - name: Check release drift
        run: |
          set -euo pipefail

          main_sha="$(git rev-parse origin/main)"
          release_sha="$(git rev-parse origin/release)"

          echo "main_sha=${main_sha}" >> "${GITHUB_ENV}"
          echo "release_sha=${release_sha}" >> "${GITHUB_ENV}"

          if [ "${main_sha}" = "${release_sha}" ]; then
            echo "Release already points to main. No promotion PR is needed."
            echo "promotion_needed=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          echo "promotion_needed=true" >> "${GITHUB_ENV}"

      - name: Prepare release promotion branch
        if: env.promotion_needed == 'true'
        run: |
          set -euo pipefail

          image_tag="sha-${main_sha:0:12}"
          promotion_branch="release-promotion-${main_sha:0:12}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --force-create "${promotion_branch}" origin/release
          git merge --no-edit origin/main

          python scripts/set_kustomize_images.py k8s/overlays/production/kustomization.yaml "${image_tag}"

          git add k8s/overlays/production/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Production image tags already pinned to ${image_tag}."
          else
            git commit -m "Pin production images ${image_tag}"
          fi

          git push origin "HEAD:${promotion_branch}" --force-with-lease

          echo "promotion_branch=${promotion_branch}" >> "${GITHUB_ENV}"
          echo "image_tag=${image_tag}" >> "${GITHUB_ENV}"

      - name: Open release pull request
        if: env.promotion_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list \
            --head "${promotion_branch}" \
            --base release \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -n "${existing_pr}" ]; then
            echo "Release PR already exists: #${existing_pr}"
            exit 0
          fi

          gh pr create \
            --base release \
            --head "${promotion_branch}" \
            --title "Promote main to release" \
            --body "Promotes the validated main branch into the protected release branch.

          This PR is the approval and validation gate for production.

          The PR branch was created from \`release\`, merged with \`main\`, and pinned to production image tag \`${image_tag}\`.

          After this PR is merged, ArgoCD will reconcile production from \`release\` and Argo Rollouts will run the automated blue-green deployment."

      - name: Write promotion summary
        run: |
          {
            echo "### Release promotion"
            echo ""
            echo "- Source branch: \`main\`"
            echo "- Target branch: \`release\`"
            echo "- Source SHA: \`${main_sha:-not checked}\`"
            echo "- Current release SHA: \`${release_sha:-not checked}\`"
            echo "- Promotion branch: \`${promotion_branch:-not created}\`"
            echo "- Production image tag: \`${image_tag:-not created}\`"
            echo "- Approval gate: release PR with release checks"
          } >> "${GITHUB_STEP_SUMMARY}"
