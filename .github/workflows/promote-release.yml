name: Promote Release

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to promote
        required: true
        type: choice
        options:
          - dev
          - production-blue
          - production-green
      source_ref:
        description: Source branch, tag, or commit to promote
        required: true
        default: main
      image_tag:
        description: Optional Docker image tag. Defaults to sha-<short source commit>.
        required: false

permissions:
  contents: write

concurrency:
  group: promote-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve promotion target
        id: target
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          SOURCE_REF: ${{ inputs.source_ref }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"

          if git rev-parse --verify --quiet "${SOURCE_REF}^{commit}" >/dev/null; then
            source_commit="$(git rev-parse "${SOURCE_REF}^{commit}")"
          elif git rev-parse --verify --quiet "origin/${SOURCE_REF}^{commit}" >/dev/null; then
            source_commit="$(git rev-parse "origin/${SOURCE_REF}^{commit}")"
          else
            echo "Unable to resolve source_ref '${SOURCE_REF}' to a commit."
            exit 1
          fi

          short_sha="${source_commit:0:12}"
          image_tag="${IMAGE_TAG_INPUT:-sha-${short_sha}}"

          case "${TARGET_ENVIRONMENT}" in
            dev)
              release_branch="release/dev"
              overlay_path="k8s/overlays/dev"
              ;;
            production-blue)
              release_branch="release/production-blue"
              overlay_path="k8s/overlays/production-blue"
              ;;
            production-green)
              release_branch="release/production-green"
              overlay_path="k8s/overlays/production-green"
              ;;
            *)
              echo "Unsupported target_environment '${TARGET_ENVIRONMENT}'."
              exit 1
              ;;
          esac

          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_branch=${release_branch}" >> "${GITHUB_OUTPUT}"
          echo "overlay_path=${overlay_path}" >> "${GITHUB_OUTPUT}"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release branch content
        run: git switch --force-create "${{ steps.target.outputs.release_branch }}" "${{ steps.target.outputs.source_commit }}"

      - name: Pin promoted image tag
        run: python scripts/set_kustomize_images.py "${{ steps.target.outputs.overlay_path }}/kustomization.yaml" "${{ steps.target.outputs.image_tag }}"

      - name: Commit release branch
        run: |
          git add "${{ steps.target.outputs.overlay_path }}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "No release branch changes to commit."
          else
            git commit -m "Promote ${{ inputs.target_environment }} to ${{ steps.target.outputs.image_tag }}"
          fi

      - name: Push release branch
        run: git push origin "HEAD:${{ steps.target.outputs.release_branch }}" --force

      - name: Write promotion summary
        run: |
          {
            echo "### Release promotion"
            echo ""
            echo "- Environment: \`${{ inputs.target_environment }}\`"
            echo "- Release branch: \`${{ steps.target.outputs.release_branch }}\`"
            echo "- Source commit: \`${{ steps.target.outputs.short_sha }}\`"
            echo "- Image tag: \`${{ steps.target.outputs.image_tag }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
