name: Promote Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  open-release-pr:
    name: Open rebase-friendly release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release branch exists
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          if ! git rev-parse --verify --quiet "origin/release^{commit}" >/dev/null; then
            echo "The release branch does not exist yet."
            echo "Create it once from main, protect it, then rerun this workflow."
            exit 1
          fi

      - name: Create release promotion branch
        run: |
          set -euo pipefail

          promotion_branch="release-promotion"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "${promotion_branch}" origin/release
          git rm -r --ignore-unmatch .
          git checkout origin/main -- .
          git add -A

          if git diff --cached --quiet; then
            echo "Release already matches main. No promotion PR is needed."
            echo "promotion_needed=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          git commit -m "Promote main to release"
          git push --force-with-lease origin "${promotion_branch}:${promotion_branch}"

          echo "promotion_needed=true" >> "${GITHUB_ENV}"
          echo "promotion_branch=${promotion_branch}" >> "${GITHUB_ENV}"

      - name: Open release pull request
        if: env.promotion_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list \
            --head "${promotion_branch}" \
            --base release \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -n "${existing_pr}" ]; then
            echo "Release PR already exists: #${existing_pr}"
            exit 0
          fi

          gh pr create \
            --base release \
            --head "${promotion_branch}" \
            --title "Promote main to release" \
            --body "Promotes the validated main branch into the protected release branch.

          This workflow creates a short-lived promotion branch based on \`release\`, then applies the current \`main\` file tree as one commit. That keeps the PR compatible with rebase/linear-history branch protection.

          After this PR is approved and merged, ArgoCD will reconcile the production applications from \`release\`."

      - name: Write promotion summary
        run: |
          {
            echo "### Release promotion"
            echo ""
            echo "- Source branch: \`main\`"
            echo "- Target branch: \`release\`"
            echo "- Promotion branch: \`${promotion_branch:-not created}\`"
            echo "- Approval gate: protected release PR"
          } >> "${GITHUB_STEP_SUMMARY}"
