name: PR Kubernetes Policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  kubernetes-policy:
    name: Kubernetes project policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Render Kubernetes manifests
        run: |
          mkdir -p rendered-manifests
          for kustomization in k8s/base/kustomization.yaml k8s/overlays/*/kustomization.yaml; do
            target_dir="$(dirname "${kustomization}")"
            target_name="$(echo "${target_dir}" | tr '/' '-')"
            kubectl kustomize "${target_dir}" > "rendered-manifests/${target_name}.yaml"
          done

      - name: Install policy dependencies
        run: python -m pip install pyyaml

      - name: Run project Kubernetes policy checks
        run: python scripts/check_k8s_policies.py rendered-manifests/*.yaml
