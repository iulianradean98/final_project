name: Check Release Images Exist

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release-images-exist:
    name: Release Docker images exist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch release branch
        run: git fetch origin release:refs/remotes/origin/release

      - name: Install policy dependencies
        run: python -m pip install pyyaml

      - name: Verify promoted Docker images exist
        run: python scripts/check_release_images_exist.py
