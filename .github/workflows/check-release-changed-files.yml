name: Check Release Changed Files

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release-changed-files:
    name: Release changed files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch release branch
        run: git fetch origin release:refs/remotes/origin/release

      - name: Validate changed files
        run: python scripts/check_release_changed_files.py
