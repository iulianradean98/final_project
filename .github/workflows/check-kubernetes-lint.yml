name: Check Kubernetes Lint

on:
  workflow_call:

permissions:
  contents: read

env:
  KUBE_LINTER_VERSION: "0.8.3"

jobs:
  kubernetes-lint:
    name: Kubernetes lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Render Kubernetes manifests
        run: |
          mkdir -p rendered-manifests
          for kustomization in k8s/base/kustomization.yaml k8s/overlays/*/kustomization.yaml; do
            target_dir="$(dirname "${kustomization}")"
            target_name="$(echo "${target_dir}" | tr '/' '-')"
            kubectl kustomize "${target_dir}" > "rendered-manifests/${target_name}.yaml"
          done

      - name: Install kube-linter
        run: |
          curl -sSL -o kube-linter "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux"
          chmod +x kube-linter
          sudo mv kube-linter /usr/local/bin/kube-linter

      - name: Lint Kubernetes manifests
        run: >
          kube-linter lint
          --exclude dangling-service
          --exclude latest-tag
          --exclude no-read-only-root-fs
          --exclude run-as-non-root
          rendered-manifests/*.yaml
