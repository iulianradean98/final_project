name: Check Release Image Tags

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release-image-tags:
    name: Release image tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch release branch
        run: git fetch origin release:refs/remotes/origin/release

      - name: Install policy dependencies
        run: python -m pip install pyyaml

      - name: Validate promoted image tags
        run: python scripts/check_release_image_tags.py
