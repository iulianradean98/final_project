name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check backend dependency consistency
        run: python -m pip check

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "0.8.0"
      KUBE_LINTER_VERSION: "0.8.3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s/base > rendered-manifests.yaml

      - name: Validate Kubernetes manifests with client dry-run
        run: kubectl apply --dry-run=client -f rendered-manifests.yaml

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests with kubeconform
        run: kubeconform -strict -summary -ignore-missing-schemas rendered-manifests.yaml

      - name: Install kube-linter
        run: |
          curl -sSL -o kube-linter "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux"
          chmod +x kube-linter
          sudo mv kube-linter /usr/local/bin/kube-linter

      - name: Lint Kubernetes manifests with kube-linter
        run: >
          kube-linter lint
          --exclude latest-tag
          --exclude no-read-only-root-fs
          --exclude run-as-non-root
          rendered-manifests.yaml

      - name: Install Kubernetes policy dependencies
        run: python -m pip install pyyaml

      - name: Run project Kubernetes policy checks
        run: python scripts/check_k8s_policies.py rendered-manifests.yaml

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: recipe-rescue-backend:ci
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: frontend
            image: recipe-rescue-frontend:ci
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}
