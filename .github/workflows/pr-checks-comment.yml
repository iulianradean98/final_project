name: PR Checks Comment

on:
  workflow_run:
    workflows:
      - PR Checks
    types:
      - completed

permissions:
  pull-requests: write

jobs:
  comment-on-failure:
    name: Comment on failed PR checks
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.pull_requests[0].number }}

    steps:
      - name: Add failure comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "PR validation failed. Please review the failed check details here: ${RUN_URL}"
