apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-rescue-api
  namespace: recipe-rescue
  labels:
    app.kubernetes.io/name: recipe-rescue-api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recipe-rescue-api
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recipe-rescue-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: iulian98/recipe-rescue-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: recipe-rescue-config
            - secretRef:
                name: recipe-rescue-api-secret
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
