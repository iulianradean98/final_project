apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-rescue-web
  namespace: recipe-rescue
  labels:
    app.kubernetes.io/name: recipe-rescue-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: recipe-rescue-web
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recipe-rescue-web
        app.kubernetes.io/component: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: recipe-rescue-web
                    app.kubernetes.io/component: frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: iulian98/recipe-rescue-frontend:latest
          imagePullPolicy: Always
          env:
            - name: API_UPSTREAM
              value: http://recipe-rescue-api:8000
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
