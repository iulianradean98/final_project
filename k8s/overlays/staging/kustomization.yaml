apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - api-external-secret.yaml
  - postgres-external-secret.yaml
namespace: recipe-rescue-staging
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: recipe-rescue
      app.kubernetes.io/environment: staging
patches:
  - target:
      kind: Namespace
      name: recipe-rescue
    patch: |-
      - op: replace
        path: /metadata/name
        value: recipe-rescue-staging
  - target:
      kind: ConfigMap
      name: recipe-rescue-config
    patch: |-
      - op: replace
        path: /data/ALLOWED_ORIGINS
        value: '["http://localhost:3001","http://recipe-rescue-staging.local"]'
  - target:
      kind: CronJob
      name: recipe-rescue-db-backup
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "37 * * * *"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/2/value
        value: recipe-rescue/staging
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/3/value
        value: staging
images:
  - name: iulian98/recipe-rescue-backend
    newTag: sha-0d8bea3ebd64
  - name: iulian98/recipe-rescue-frontend
    newTag: sha-0d8bea3ebd64
