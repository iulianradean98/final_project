apiVersion: v1
kind: ServiceAccount
metadata:
  name: recipe-rescue-rollout-observer
  labels:
    app.kubernetes.io/name: recipe-rescue-rollout-observer
    app.kubernetes.io/component: rollout-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recipe-rescue-rollout-observer
  labels:
    app.kubernetes.io/name: recipe-rescue-rollout-observer
    app.kubernetes.io/component: rollout-observer
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - rollouts
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recipe-rescue-rollout-observer
  labels:
    app.kubernetes.io/name: recipe-rescue-rollout-observer
    app.kubernetes.io/component: rollout-observer
subjects:
  - kind: ServiceAccount
    name: recipe-rescue-rollout-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: recipe-rescue-rollout-observer
