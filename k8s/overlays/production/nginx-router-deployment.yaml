apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-rescue-router
  labels:
    app.kubernetes.io/name: recipe-rescue-router
    app.kubernetes.io/component: edge-router
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: recipe-rescue-router
      app.kubernetes.io/component: edge-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recipe-rescue-router
        app.kubernetes.io/component: edge-router
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: recipe-rescue-router
                    app.kubernetes.io/component: edge-router
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: recipe-rescue-router-config
