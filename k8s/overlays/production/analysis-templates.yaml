apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: recipe-rescue-web-backend-rollout-ready
spec:
  metrics:
    - name: web-backend-rollout-ready
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 660
            ttlSecondsAfterFinished: 1800
            template:
              spec:
                restartPolicy: Never
                serviceAccountName: recipe-rescue-rollout-observer
                containers:
                  - name: rollout-check
                    image: alpine/k8s:1.34.0
                    command:
                      - /bin/sh
                      - -ec
                    args:
                      - |
                        attempt=1
                        while [ "${attempt}" -le 30 ]; do
                          phase="$(kubectl get rollout recipe-rescue-api -o jsonpath='{.status.phase}')"
                          current_hash="$(kubectl get rollout recipe-rescue-api -o jsonpath='{.status.currentPodHash}')"
                          stable_hash="$(kubectl get rollout recipe-rescue-api -o jsonpath='{.status.stableRS}')"
                          abort="$(kubectl get rollout recipe-rescue-api -o jsonpath='{.status.abort}')"
                          message="$(kubectl get rollout recipe-rescue-api -o jsonpath='{.status.message}')"

                          echo "Backend rollout attempt ${attempt}: phase=${phase}, current=${current_hash}, stable=${stable_hash}, abort=${abort}, message=${message}"

                          if [ "${phase}" = "Healthy" ] && [ -n "${current_hash}" ] && [ "${current_hash}" = "${stable_hash}" ] && [ "${abort}" != "true" ]; then
                            echo "Backend rollout is healthy and stable. Frontend can promote."
                            exit 0
                          fi

                          if [ "${phase}" = "Degraded" ] || [ "${abort}" = "true" ]; then
                            echo "Backend rollout is degraded or aborted. Blocking frontend promotion."
                            exit 1
                          fi

                          sleep 20
                          attempt=$((attempt + 1))
                        done

                        echo "Timed out waiting for backend rollout to become healthy and stable."
                        exit 1
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 64Mi
---
