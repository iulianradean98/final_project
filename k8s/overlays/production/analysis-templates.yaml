apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: recipe-rescue-api-preview-smoke
spec:
  metrics:
    - name: api-preview-smoke
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 240
            ttlSecondsAfterFinished: 1800
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.11.1
                    command:
                      - /bin/sh
                      - -c
                    args:
                      - |
                        set -eu
                        check() {
                          curl --retry 6 --retry-delay 5 --retry-all-errors --max-time 10 -fsS "$1"
                        }

                        check http://recipe-rescue-api-preview:8000/api/health
                        check http://recipe-rescue-api-preview:8000/api/ready
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 64Mi
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: recipe-rescue-api-active-health
spec:
  metrics:
    - name: api-active-health
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 900
            ttlSecondsAfterFinished: 1800
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.11.1
                    command:
                      - /bin/sh
                      - -c
                    args:
                      - |
                        set -eu
                        check() {
                          curl --retry 6 --retry-delay 5 --retry-all-errors --max-time 10 -fsS "$1"
                        }

                        for i in $(seq 1 10); do
                          check http://recipe-rescue-api:8000/api/health
                          check http://recipe-rescue-api:8000/api/ready
                          if [ "$i" -lt 10 ]; then
                            sleep 60
                          fi
                        done
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 64Mi
---
