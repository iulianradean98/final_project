apiVersion: v1
kind: ConfigMap
metadata:
  name: recipe-rescue-router-config
  labels:
    app.kubernetes.io/name: recipe-rescue-router
    app.kubernetes.io/component: edge-router
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://recipe-rescue-api:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://recipe-rescue-web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
