apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - postgres-external-secret.yaml
namespace: recipe-rescue-production-data
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: recipe-rescue
      app.kubernetes.io/environment: production
      app.kubernetes.io/component: database
patches:
  - target:
      kind: Namespace
      name: recipe-rescue
    patch: |-
      - op: replace
        path: /metadata/name
        value: recipe-rescue-production-data
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: recipe-rescue-config
        namespace: recipe-rescue
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: recipe-rescue-api
        namespace: recipe-rescue
      $patch: delete
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: recipe-rescue-api
        namespace: recipe-rescue
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: recipe-rescue-web
        namespace: recipe-rescue
      $patch: delete
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: recipe-rescue-web
        namespace: recipe-rescue
      $patch: delete
